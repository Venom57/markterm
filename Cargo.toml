[package]
name = "markterm"
version = "0.1.0"
edition = "2021"
description = "A markdown viewer for the terminal with built-in paging"
license = "MIT"

[dependencies]
pulldown-cmark = { version = "0.12", default-features = false }
crossterm = { version = "0.28", default-features = false, features = ["events"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
